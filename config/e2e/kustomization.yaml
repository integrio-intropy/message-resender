apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../default
- rabbitmq.yaml
- rbac_namespaced.yaml
patches:
- path: manager_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
- path: rbac_patch.yaml
  target:
    kind: ClusterRoleBinding
    name: message-resender-manager-rolebinding
