# This rule is not used by the project message-resender itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the messaging.intropy.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: message-resender
    app.kubernetes.io/managed-by: kustomize
  name: resendpolicy-editor-role
rules:
- apiGroups:
  - messaging.intropy.io
  resources:
  - resendpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - messaging.intropy.io
  resources:
  - resendpolicies/status
  verbs:
  - get
