{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "message-resender.fullname" . }}-manager
  labels:
    {{- include "message-resender.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - messaging.intropy.io
    resources:
      - resendpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - messaging.intropy.io
    resources:
      - resendpolicies/status
    verbs:
      - get
      - patch
      - update
{{- end }}
