{{- $create := false -}}
{{- if eq .Values.broker.type "rabbitmq" -}}
  {{- if and (not .Values.broker.rabbitmq.existingSecret) .Values.broker.rabbitmq.dsn -}}
    {{- $create = true -}}
  {{- end -}}
{{- else if eq .Values.broker.type "azureservicebus" -}}
  {{- if and (not .Values.broker.azureServiceBus.existingSecret) .Values.broker.azureServiceBus.connectionString -}}
    {{- $create = true -}}
  {{- end -}}
{{- end -}}
{{- if $create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-broker" (include "message-resender.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "message-resender.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if eq .Values.broker.type "rabbitmq" }}
  {{ .Values.broker.rabbitmq.secretKey }}: {{ .Values.broker.rabbitmq.dsn | b64enc | quote }}
  {{- else if eq .Values.broker.type "azureservicebus" }}
  {{ .Values.broker.azureServiceBus.secretKey }}: {{ .Values.broker.azureServiceBus.connectionString | b64enc | quote }}
  {{- end }}
{{- end }}
