{{- if and .Values.rbac.create .Values.manager.watchNamespaces }}
{{- $fullname := include "message-resender.fullname" . -}}
{{- $labels := include "message-resender.labels" . -}}
{{- $saName := include "message-resender.serviceAccountName" . -}}
{{- $releaseNamespace := .Release.Namespace -}}
{{- range splitList "," .Values.manager.watchNamespaces }}
{{- $ns := trim . }}
{{- if $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-manager
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $releaseNamespace }}
{{- end }}
{{- end }}
{{- end }}
