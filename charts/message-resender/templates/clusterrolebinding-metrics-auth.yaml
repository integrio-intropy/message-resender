{{- if and .Values.rbac.create .Values.metrics.enabled .Values.metrics.secure }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "message-resender.fullname" . }}-metrics-auth
  labels:
    {{- include "message-resender.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "message-resender.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "message-resender.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
