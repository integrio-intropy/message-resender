{{- if and .Values.rbac.create .Values.manager.leaderElect }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "message-resender.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "message-resender.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "message-resender.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "message-resender.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
