name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  verify-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
      - run: make manifests generate fmt
      - run: git diff --exit-code -- . ':!go.sum'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/golangci-lint
            bin/
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: golangci-lint-${{ runner.os }}-
      - run: make lint

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - run: helm lint charts/message-resender/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
      - run: make test
